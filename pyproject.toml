[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p-vs-np-research-lab"
version = "0.2.0"
description = "Исследовательская лаборатория для воспроизводимых экспериментов с SAT, точным поиском и гипотезами вокруг P vs NP."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "crakacr-alt"}
]
dependencies = []

[project.optional-dependencies]
# Нужен только для подключения проекта к MCP-совместимой модели/агенту.
mcp = ["mcp>=1.0.0"]
# Нужен только для независимой сверки результатов с промышленным SAT solver.
reference = ["python-sat"]
# Нужен только разработчику: статическая проверка стиля и простых ошибок.
dev = ["ruff>=0.6"]

[project.scripts]
pnp-lab = "pnp_lab.cli:main"
pnp-lab-mcp = "pnp_lab.mcp_server:main"

[tool.setuptools.packages.find]
include = ["pnp_lab*"]

[tool.ruff]
line-length = 100
