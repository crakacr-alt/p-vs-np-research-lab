[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p-vs-np-research-lab"
version = "1.2.0"
description = "Проверяемая вычислительная лаборатория с SAT, LabScript, воспроизводимыми экспериментами и AI/MCP-интеграцией."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "crakacr-alt"}
]
license = {text = "MIT"}
keywords = ["sat", "complexity", "p-vs-np", "research", "turing-machine", "labscript", "scientific-computing"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]
reference = ["python-sat"]
dev = ["ruff>=0.6", "hypothesis>=6.112"]
release = ["build>=1.2", "twine>=6"]
jupyter = ["ipython>=8"]

[project.urls]
Repository = "https://github.com/crakacr-alt/p-vs-np-research-lab"
Issues = "https://github.com/crakacr-alt/p-vs-np-research-lab/issues"

[project.scripts]
pnp-lab = "pnp_lab.cli:main"
pnp-lab-mcp = "pnp_lab.mcp_server:main"
labscript = "pnp_lab.labscript.cli:main"

[tool.setuptools.packages.find]
include = ["pnp_lab*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
