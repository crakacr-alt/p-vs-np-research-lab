[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p-vs-np-research-lab"
version = "1.0.0"
description = "Научная лаборатория для воспроизводимых SAT-экспериментов и точного representation switching."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "crakacr-alt"}
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]
reference = ["python-sat"]
dev = ["ruff>=0.6"]
release = ["build>=1.2", "twine>=6"]

[project.scripts]
pnp-lab = "pnp_lab.cli:main"
pnp-lab-mcp = "pnp_lab.mcp_server:main"

[tool.setuptools.packages.find]
include = ["pnp_lab*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
