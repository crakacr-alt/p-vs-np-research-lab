name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: pnp-lab doctor
      - run: pnp-lab benchmark --output /tmp/pnp-release-benchmark

  reference-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[reference]"
      - run: >
          pnp-lab verify
          --variables 8
          --clauses 30
          --count 30
          --bruteforce
          --reference

  property-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s property_tests -v

  mcp-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[mcp]"
      - run: python -c "from pnp_lab.mcp_server import build_server; build_server(); print('MCP OK')"

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check pnp_lab tests property_tests

  package-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[release]"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          pnp-lab doctor
      - uses: actions/upload-artifact@v7
        with:
          name: p-vs-np-research-lab-1.1.2
          path: dist/*
