name: tests

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установить проект
        run: python -m pip install -e .

      - name: Запустить unit-тесты
        run: python -m unittest discover -s tests -v

      - name: Самопроверка
        run: pnp-lab doctor

      - name: Структурный benchmark
        run: pnp-lab benchmark --output /tmp/pnp-release-benchmark

  reference-check:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить PySAT reference
        run: python -m pip install -e ".[reference]"

      - name: Differential check с PySAT и brute force
        run: >
          pnp-lab verify
          --variables 8
          --clauses 30
          --count 30
          --bruteforce
          --reference

  mcp-check:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить MCP-дополнение
        run: python -m pip install -e ".[mcp]"

      - name: Создать MCP server
        run: python -c "from pnp_lab.mcp_server import build_server; build_server(); print('MCP OK')"

  style:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить dev-зависимости
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check pnp_lab tests


  package-check:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить инструменты релиза
        run: python -m pip install -e ".[release]"

      - name: Собрать wheel и source distribution
        run: python -m build

      - name: Проверить metadata пакетов
        run: python -m twine check dist/*

      - name: Проверить установку wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          pnp-lab doctor

      - name: Сохранить release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p-vs-np-research-lab-1.1.0
          path: dist/*
