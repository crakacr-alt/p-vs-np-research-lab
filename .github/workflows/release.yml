name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install release tools
        run: python -m pip install -e ".[dev,release]"

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "tag $GITHUB_REF_NAME does not match package version v$version"
            exit 1
          }

      - name: Verify release candidate
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s property_tests -v
          ruff check pnp_lab tests property_tests
          pnp-lab doctor
          labscript check examples/labscript_russian.lab
          labscript run examples/labscript_english.lab
          labscript build examples/labscript_english.lab -o /tmp/release-demo.labpkg
          labscript verify /tmp/release-demo.labpkg

      - name: Build package
        run: |
          rm -rf dist
          python -m build
          python -m twine check dist/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "P vs NP Research Lab $GITHUB_REF_NAME"
